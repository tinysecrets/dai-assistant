name: CI

# The spine is stdlib-only and localhost-only, so CI needs no secrets and no
# network access to a provider.  Inference is exercised against a stub upstream
# that the test suite starts itself.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor the code targets; 3.11 is what Debian stable ships.
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # tests/test_repo_consistency.py shells out to git (`ls-files`, `grep`) to
      # enumerate the tree.  On a runner where the workspace owner differs from
      # the job user, git refuses with "dubious ownership" and those calls fail,
      # which surfaces as test errors rather than as a git problem.  Saying this
      # explicitly costs nothing and removes that whole class of confusion.
      - name: Trust the workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Record the environment
        run: |
          {
            echo "python:  $(python -V 2>&1)"
            echo "cwd:     $PWD"
            echo "git:     $(git --version 2>&1)"
            echo "head:    $(git rev-parse --short HEAD 2>&1)"
            echo "tracked: $(git ls-files --cached --others --exclude-standard 2>&1 | wc -l) files"
            echo "curl:    $(curl --version 2>&1 | head -1)"
            echo "bash:    $BASH_VERSION"
          } | tee /tmp/ci-env.txt

      - name: Byte-compile
        run: python -m compileall -q lib services skills tests 2>&1 | tee /tmp/ci-compile.txt

      - name: Validate service configuration
        run: |
          python services/model-router/server.py --check 2>&1 | tee /tmp/ci-check.txt
          python services/agent-s-worker/server.py --check 2>&1 | tee -a /tmp/ci-check.txt

      - name: Print resolved configuration (secret-free)
        run: |
          python services/model-router/server.py --print-config
          python services/agent-s-worker/server.py --print-config

      - name: Shell syntax
        run: |
          for f in bin/*.sh bin/dai; do bash -n "$f"; done

      - name: Test suite
        # `shell: bash` selects `bash -eo pipefail`, so `tee` cannot mask a
        # failing exit status the way the default shell would.
        shell: bash
        run: python -m unittest discover -s tests -t . 2>&1 | tee /tmp/ci-suite.txt

      - name: Smoke (suite + static checks; no services running)
        shell: bash
        run: ./bin/smoke.sh --tests-only 2>&1 | tee /tmp/ci-smoke.txt

      - name: Doctor must not fail on a clean checkout
        shell: bash
        run: ./bin/doctor.sh 2>&1 | tee /tmp/ci-doctor.txt

      # Failing Actions logs are not reachable from every environment, so on
      # failure the job re-emits the tail of each captured log as a check
      # annotation.  Annotations are readable through the API and show up in the
      # Checks UI, which turns "the job failed" into "here is the assertion that
      # failed" without needing the raw log download.
      - name: Surface the failure as annotations
        if: failure()
        shell: bash
        run: |
          # This step is a reporter and must never fail on its own, or it hides
          # the very failure it exists to report.  An earlier version did exactly
          # that: `shell: bash` implies `-eo pipefail`, and grep exits 1 when it
          # matches nothing, so a log with no recognisable error line killed the
          # step.  Hence `set +e`, per-call guards, and a final `exit 0`.
          set +e
          emit() {
            title="$1"; file="$2"
            [ -s "$file" ] || return 0
            picked=$(grep -E "^(FAIL|ERROR):|^(AssertionError|TypeError|KeyError|ValueError|RuntimeError|FileNotFoundError|CalledProcessError|OSError|subprocess\.)|Error:|error:|Traceback|^FAILED|^Ran [0-9]+ test|skipped" "$file" | head -50)
            [ -n "$picked" ] || picked=$(tail -40 "$file")
            # Annotation messages are single-line and use %0A for a newline, so
            # percent signs in the payload must be escaped first.  (Not
            # `paste -sd '%0A'`: -d takes a list of single characters to cycle
            # through, which emits '%', '0', 'A' as separators instead.)
            body=$(printf '%s\n' "$picked" | awk '{gsub(/%/, "%25"); gsub(/\r/, "%0D"); printf "%s%s", (NR > 1 ? "%0A" : ""), $0}')
            [ -n "$body" ] || return 0
            echo "::error title=${title}::${body}"
            return 0
          }
          emit "environment (python ${{ matrix.python-version }})" /tmp/ci-env.txt
          emit "byte-compile" /tmp/ci-compile.txt
          emit "service --check" /tmp/ci-check.txt
          emit "test suite" /tmp/ci-suite.txt
          emit "smoke" /tmp/ci-smoke.txt
          emit "doctor" /tmp/ci-doctor.txt
          exit 0

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run shellcheck
        # bin/lib.sh is sourced, so it is checked through its consumers with -x.
        run: shellcheck -x -S warning bin/*.sh bin/dai

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: python -m pip install --upgrade ruff

      - name: Lint
        run: ruff check lib services skills tests

      - name: Format check
        run: ruff format --diff lib services skills tests

  hygiene:
    name: repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No secrets committed
        run: |
          ! git grep -nIE \
            'sk-or-v1-[A-Za-z0-9]{16,}|gsk_[A-Za-z0-9]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----' \
            -- ':!tests' ':!*.example' ':!docs'

      - name: No trailing whitespace
        run: |
          ! git grep -nI ' $' -- '*.py' '*.sh' '*.md' '*.json' 'bin/dai'

      - name: Every text file ends with a newline
        run: |
          fail=0
          for f in $(git ls-files); do
            case "$f" in *.png|*.jpg|*.ico) continue;; esac
            [ -s "$f" ] || continue
            [ -z "$(tail -c 1 "$f")" ] || { echo "missing newline: $f"; fail=1; }
          done
          exit $fail

      - name: Executable bits are correct
        run: |
          for f in bin/*.sh bin/dai; do
            [ "$f" = "bin/lib.sh" ] && continue
            [ -x "$f" ] || { echo "not executable: $f"; exit 1; }
          done
          [ ! -x bin/lib.sh ] || { echo "bin/lib.sh is sourced and must not be executable"; exit 1; }
